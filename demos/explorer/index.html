<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>starscapes</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; }
    #view { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
    #view:active { cursor: grabbing; }
    #hud, #families, #controls {
      position: fixed; left: 12px;
      font: 12px/1.5 ui-monospace, monospace; color: #333;
      background: rgba(255, 255, 255, 0.88); padding: 4px 8px; border-radius: 4px;
    }
    #hud { bottom: 10px; right: 12px; pointer-events: none; }
    #families { top: 10px; right: 12px; }
    #families a { color: #234; margin-right: 0.8em; display: inline-block; }
    #families a.current { font-weight: bold; text-decoration: none; }
    #controls { top: 76px; width: 250px; }
    #controls label { display: grid; grid-template-columns: 88px 1fr 46px; align-items: center; gap: 6px; }
    #controls input[type="range"] { width: 100%; margin: 0; }
    #controls input[type="checkbox"] { justify-self: start; }
    #controls span { text-align: right; }
    #controls div { margin-top: 6px; display: flex; gap: 4px; flex-wrap: wrap; }
    #controls button { font: inherit; padding: 1px 6px; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <nav id="families"></nav>
  <div id="controls"></div>
  <div id="hud"></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
