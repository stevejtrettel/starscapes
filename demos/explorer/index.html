<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>starscapes</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; }
    #view { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
    #view:active { cursor: grabbing; }
    #hud, #families {
      position: fixed; left: 12px;
      font: 12px/1.4 ui-monospace, monospace; color: #333;
      background: rgba(255, 255, 255, 0.85); padding: 4px 8px; border-radius: 4px;
    }
    #hud { bottom: 10px; pointer-events: none; }
    #families { top: 10px; }
    #families a { color: #234; margin-right: 0.8em; }
    #families a.current { font-weight: bold; text-decoration: none; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <nav id="families"></nav>
  <div id="hud"></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
